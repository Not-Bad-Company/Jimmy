<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimmy</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Main Robot Screen: Pure Black Display with Centered White Eyes -->
      <main id="faceStage" class="face-stage" title="Click screen or hold Space to talk">
        <canvas id="faceCanvas"></canvas>

        <!-- Minimal listening indicator (only active while microphone is recording) -->
        <div id="listeningIndicator" class="listening-indicator" aria-hidden="true">
          <span class="listening-pulse"></span>
          <span>LISTENING</span>
        </div>

        <!-- Hidden developer text input (Press 'T' to toggle) -->
        <div id="devTextInput" class="dev-text-input hidden">
          <span class="prompt-sym">&gt;</span>
          <input
            type="text"
            id="cliInput"
            placeholder="Type transmission to Jimmy (ESC to dismiss, Enter to transmit)..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </main>

      <!-- Internal Raw Transcription Sidebar Split -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">RAW TRANSCRIPTION</span>
          <div class="sidebar-actions">
            <button id="btnToggleDebug" class="sidebar-btn" title="Show/hide latency and system messages">DEBUG</button>
            <button id="btnClearTranscript" class="sidebar-btn" title="Clear log">CLEAR</button>
            <button id="btnToggleSidebar" class="sidebar-btn" title="Toggle sidebar (Key: D)">HIDE [D]</button>
          </div>
        </div>

        <div id="rawLog" class="raw-log" role="log" aria-live="polite"></div>

        <div class="sidebar-footer">
          <div class="sidebar-stats">
            <span id="statState">STATE: IDLE</span>
            <span id="statEmotion">EMO: NEUTRAL</span>
            <span id="statLatency">LATENCY: --</span>
          </div>
          <div class="sidebar-shortcuts">
            <span>[SPACE] PTT</span>
            <span>[T] TEXT</span>
            <span>[D] SIDEBAR</span>
            <span>[1-9] EMOTIONS</span>
          </div>
        </div>
      </aside>

      <!-- Subtle collapsed toggle button -->
      <button id="btnOpenSidebar" class="btn-sidebar-open" title="Open internal transcript log (Key: D)">
        LOG [D]
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
